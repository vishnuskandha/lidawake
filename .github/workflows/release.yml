name: release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: scripts/build-deb.sh "${GITHUB_REF_NAME#v}" && scripts/build-extension-zip.sh
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.deb
            dist/awayke-extension.zip
          body_path: CHANGELOG.md
